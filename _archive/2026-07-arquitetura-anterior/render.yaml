services:
  - type: web
    name: captur-backend
    env: node
    buildCommand: cd services/backend && npm install && npx prisma generate && npm run build
    startCommand: cd services/backend && npx prisma migrate deploy && npm start
    envVars:
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        sync: false # DEFINIR MANUALMENTE no dashboard do Render — nunca commitar segredos aqui.
      - key: GROQ_API_KEY
        sync: false # DEFINIR MANUALMENTE no dashboard do Render. A chave antiga hardcoded aqui
        # foi removida por segurança em 26/08/2026 — se ainda for válida, revogue-a em
        # console.groq.com/keys e gere uma nova, pois esteve em texto puro no repositório.
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: DATABASE_URL
        fromDatabase:
          name: captur-db
          property: connectionString

databases:
  - name: captur-db
    plan: free
